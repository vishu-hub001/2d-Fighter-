<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fight Arena</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="controls">
    <div id="dpad"><i class="a u">▲</i><i class="a d">▼</i><i class="a l">◀</i><i class="a r">▶</i><b></b></div>
    <div id="btns">
      <button data-b="lp" class="p">LP</button><button data-b="hp" class="p">HP</button><button data-b="sp" class="s">SP</button>
      <button data-b="lk" class="k">LK</button><button data-b="hk" class="k">HK</button><button data-b="th" class="g">GRAB</button>
      <button data-b="su" class="su" id="b-su">SUPER</button>
    </div>
  </div>
  <div id="rotate">Rotate your phone to landscape 📱↻</div>
</div>
<script src="config.js"></script>
<script src="characters.js"></script>
<script src="fighter.js"></script>
<script src="match.js"></script>
<script src="net.js"></script>
<script src="ai.js"></script>
<script src="audio.js"></script>
<script src="input.js"></script>
<script src="sprites.js"></script>
<script src="world.js"></script>
<script src="main.js"></script>
</body>
</html>
